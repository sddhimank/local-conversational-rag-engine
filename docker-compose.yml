
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    # Force optimization settings directly into postgres execution
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./app/ollama_init.sh:/tmp/ollama_init.sh # mount the entry script
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 8G

    # Override container entrypoint to convert line endings and run the script automatically
    entrypoint:
      - /bin/sh
      - -c
      - |
        # 1. Copy the script to an internal container directory to break the mount lock
        cp /tmp/ollama_init.sh /root/ollama_init.sh
        
        # 2. Safely strip Windows carriage returns and set execution rights
        sed -i 's/\r$//' /root/ollama_init.sh
        chmod +x /root/ollama_init.sh
        
        # 3. Execute the clean modular script from the container layer
        /root/ollama_init.sh
    # -- Add ollama health check
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30  # Allows up to 5 minutes for downloads to settle

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  # NEW SERVICE: Streamlit RAG Web Application Container Configuration
  rag-web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_streamlit_app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8501:8501"
      - "8502:8502"
    volumes:
      - ./app:/workspace/app
      - ./app/data:/workspace/data  # Shared mount volume to inject folder files dynamically
      - ./upload:/workspace/upload
      - ./agent_data:/workspace/agent_data
    environment:
      - DB_URL=postgresql+psycopg://rag_user:rag_password@postgres:5432/rag_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=LOCAL # Toggle profile type configuration
    depends_on:
      postgres:
        condition: service_healthy  # Wait until PostgreSQL is fully healthy before starting app
      ollama:
        condition: service_healthy # App waits until models are fully pulled!
      redis:
        condition: service_healthy
    command: sh -c "python app/watcher.py & streamlit run app/ui.py --server.port=8501 --server.address=0.0.0.0"

  rag-celery-worker:
    build: .
    container_name: rag_celery_worker
    dns:
      - 8.8.8.8
      - 8.8.8.8
    environment:
      - DB_URL=postgresql+psycopg://rag_user:rag_password@postgres:5432/rag_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/workspace/app
      - ./data:/workspace/data
      - ./upload:/workspace/upload
      - ./agent_data:/workspace/agent_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Launches Celery background worker allocating tasks across all available CPU cores dynamically
    entrypoint: ""
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -P threads

volumes:
  pgdata:
  ollama_data:
