name: Python CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone the GitHub repository files into the runner workspace
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up an isolated Python 3.11 environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up subsequent runs by caching dependencies

    # Step 3: Install linting tools and project prerequisites
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step 4: Run Code Lint Check (Fails build if syntax errors or bad practices are found)
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all all standard stylistic warnings as info (won't crash pipeline)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Step 5: Execute Python Unit Tests (Baseline framework check)
    - name: Test with pytest
      env:
        # ✅ FIX: Forces pytest to look into the workspace root so it resolves 'app.ingest' perfectly
        PYTHONPATH: .
      run: |
        # Run tests if test suites exist, otherwise pass safely
        if [ -d "tests" ]; then pytest; else echo "No tests configured yet. Skipping."; fi
